name: Publish Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and test package
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$REF_TYPE" != "tag" ] || [ "$RELEASE_TAG" != "$TAG" ]; then
            echo "Run this workflow from the tag matching the package version: $TAG" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Generate release documentation
        run: |
          npm run changelog
          mkdir -p artifact
          node release-notes.mjs artifact/release-notes.md
      - name: Test and build
        run: npm run check
      - name: Pack the tested build
        run: |
          mkdir -p artifact
          npm pack --ignore-scripts --pack-destination artifact
          mv artifact/*.tgz artifact/package.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            artifact/package.tgz
            artifact/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tested artifact
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        run: |
          node --version
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("Trusted publishing requires npm >=11.5.1. Update the setup-node Node version.");
            }
          ' "$(npm --version)"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifact
      - name: Unpack the built package
        run: tar -xzf artifact/package.tgz
      - name: Publish with npm trusted publishing
        id: npm
        env:
          NPM_DIST_TAG: ${{ needs.build.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          npm publish ./package --ignore-scripts --access public --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub release notes
        if: steps.npm.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file artifact/release-notes.md
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TAG" --notes-file artifact/release-notes.md --prerelease="$PRERELEASE"
          fi
